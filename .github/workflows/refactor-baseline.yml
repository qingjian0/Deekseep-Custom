name: Refactor baseline validation

on:
  push:
    branches: [refactor/kotlin-hook-architecture]
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Unique per run: GitHub otherwise retains only one pending run per group.
  group: refactor-baseline-${{ github.ref }}-${{ github.run_id }}
  # Keep full regression/build evidence; rapid pushes must not cancel an active validation run.
  cancel-in-progress: false

jobs:
  source-regressions:
    name: JVM regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Java 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Check shell script syntax
        shell: bash
        run: |
          set -euo pipefail
          for script in \
            module-legacy/build.sh module-universal/build.sh \
            module-legacy/test-adapter-regression.sh \
            module/test-hook-install-registry.sh module/test-config-rollout-install-regression.sh module/test-native-dual-root-install-regression.sh module/test-login-diagnostics-regression.sh \
            module/test-session-deletion-install-regression.sh module/test-target-process-guard.sh \
            scripts/android-tools.sh scripts/build-all-legacy.sh \
            scripts/test-package-identity.sh scripts/test-launcher-activation-regression.sh \
            scripts/test-launcher-config-architecture.sh \
            scripts/test-launcher-backup-architecture.sh \
            scripts/test-universal-feature-parity.sh; do
            bash -n "$script"
          done
      - name: Run legacy Xposed adapter regression
        run: bash module-legacy/test-adapter-regression.sh
      - name: Verify Android package identity contract
        run: bash scripts/test-package-identity.sh
      - name: Run launcher activation semantics regression
        run: bash scripts/test-launcher-activation-regression.sh
      - name: Run launcher config architecture regression
        run: bash scripts/test-launcher-config-architecture.sh
      - name: Run launcher backup architecture regression
        run: bash scripts/test-launcher-backup-architecture.sh
      - name: Run expert relay regression
        run: bash module/test-expert-relay-regression.sh
      - name: Run feature hook registry regression
        run: bash module/test-hook-install-registry.sh
      - name: Run config rollout install regression
        run: bash module/test-config-rollout-install-regression.sh
      - name: Run native dual-root install regression
        run: bash module/test-native-dual-root-install-regression.sh
      - name: Run login diagnostics privacy regression
        run: bash module/test-login-diagnostics-regression.sh
      - name: Run session deletion install regression
        run: bash module/test-session-deletion-install-regression.sh
      - name: Run native session click install regression
        run: bash module/test-native-session-click-install-regression.sh
      - name: Run target process admission regression
        run: bash module/test-target-process-guard.sh

  android-build-matrix:
    # Full Android builds run on demand or when a Draft PR becomes ready for review.
    # Pushes during active development still run the fast JVM/source regression job.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[android-validate]'))
    name: Android artifact compilation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Every variant must sign with the exact same CI-only key. Pass an absolute path so
      # Gradle's project-relative file() resolution cannot silently select another keystore.
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/module/debug.keystore
      ANDROID_STORE_PASSWORD: android
      ANDROID_KEY_ALIAS: androiddebugkey
      ANDROID_KEY_PASSWORD: android
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Java 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          gradle-version: "9.8.2"
      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT/platforms"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
      - name: Install Android SDK platforms and build tools
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platforms;android-35" \
            "platforms;android-37.0" \
            "build-tools;35.0.0" \
            "build-tools;37.0.0"
      - name: Prepare isolated debug signing key
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore module/debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000
      - name: Build legacy artifact
        run: bash module-legacy/build.sh
      - name: Build universal artifact
        run: bash module-universal/build.sh
      - name: Run Android-dependent chat thinking regression
        run: bash module/test-thinking-regression.sh
      - name: Build Google Play Universal artifact
        run: GOOGLE_PLAY_BUILD=true bash module-universal/build.sh
      - name: Verify Universal channel feature parity
        run: bash scripts/test-universal-feature-parity.sh
      - name: Build Compose launcher Open variant
        working-directory: compose-launcher
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace \
            -PprotectedBuild=false \
            -PlocalApiIncluded=false \
            :app:assembleDebug
      - name: Verify produced APK structures
        run: |
          set -euo pipefail
          test -s module-legacy/ds-probe-legacy.apk
          test -s module-universal/ds-probe-universal.apk
          test -s module-universal/ds-probe-universal-google-play.apk
          test -s compose-launcher/app/build/outputs/apk/debug/app-debug.apk
          BUILD_TOOLS_DIR="$ANDROID_HOME/build-tools/37.0.0"
          test -x "$BUILD_TOOLS_DIR/zipalign"
          test -x "$BUILD_TOOLS_DIR/apksigner"
          for apk in \
            module-legacy/ds-probe-legacy.apk \
            module-universal/ds-probe-universal.apk \
            module-universal/ds-probe-universal-google-play.apk \
            compose-launcher/app/build/outputs/apk/debug/app-debug.apk; do
            unzip -t "$apk" >/dev/null
            "$BUILD_TOOLS_DIR/zipalign" -c -v 4 "$apk" >/dev/null
            "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$apk" >/dev/null
            package_metadata="$("$BUILD_TOOLS_DIR/aapt" dump badging "$apk")"
            grep -Fq "package: name='ds.dsh.DeepSeek'" <<< "$package_metadata" \
              || { echo "Unexpected package identity in $apk" >&2; exit 1; }
            dex_count="$(unzip -Z1 "$apk" | grep -Ec '^classes([0-9]+)?\.dex$' || true)"
            test "$dex_count" -ge 1
            echo "$apk contains $dex_count DEX file(s)"
          done

      - name: Verify shared APK signing identity
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS_DIR="$ANDROID_HOME/build-tools/37.0.0"
          certificate_sha256() {
            "$BUILD_TOOLS_DIR/apksigner" verify --print-certs "$1" \
              | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
              | head -n 1
          }
          legacy_cert="$(certificate_sha256 module-legacy/ds-probe-legacy.apk)"
          universal_cert="$(certificate_sha256 module-universal/ds-probe-universal.apk)"
          google_play_cert="$(certificate_sha256 module-universal/ds-probe-universal-google-play.apk)"
          compose_cert="$(certificate_sha256 compose-launcher/app/build/outputs/apk/debug/app-debug.apk)"
          test -n "$legacy_cert"
          test -n "$universal_cert"
          test -n "$google_play_cert"
          test -n "$compose_cert"
          echo "APK signing certificate SHA-256:"
          echo "  Legacy:        $legacy_cert"
          echo "  Universal:     $universal_cert"
          echo "  Google Play:   $google_play_cert"
          echo "  Compose:       $compose_cert"
          if [[ "$legacy_cert" != "$universal_cert" ]]; then
            echo "Legacy and Universal signing certificates differ." >&2
            exit 1
          fi
          if [[ "$universal_cert" != "$google_play_cert" ]]; then
            echo "Domestic and Google Play Universal signing certificates differ." >&2
            exit 1
          fi
          if [[ "$google_play_cert" != "$compose_cert" ]]; then
            echo "Google Play Universal and Compose signing certificates differ." >&2
            exit 1
          fi
          echo "All four APKs share signing certificate $legacy_cert"

      - name: Upload Android artifacts and verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: refactor-android-validation-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            module-legacy/ds-probe-legacy.apk
            module-universal/ds-probe-universal.apk
            module-universal/ds-probe-universal-google-play.apk
            compose-launcher/app/build/outputs/apk/debug/app-debug.apk
            compose-launcher/app/build/reports/
            compose-launcher/app/build/outputs/logs/
