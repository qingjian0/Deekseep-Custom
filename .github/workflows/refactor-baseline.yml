name: Permissive Android build

on:
  push:
    branches: [refactor/kotlin-hook-architecture]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    name: Build Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          gradle-version: "9.8.2"

      - name: Run Legacy Xposed adapter regression matrix
        run: bash module-legacy/test-adapter-regression.sh

      - name: Install required Android SDK components
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;37.0.0"

      - name: Prepare temporary debug signing key
        run: |
          set -e
          keytool -genkeypair -noprompt \
            -keystore module/debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -dname "CN=YunSeek CI Debug,O=CI Only,C=US" \
            -keyalg RSA -keysize 2048 -validity 2
          echo "Temporary CI-only debug key created."

      - name: Build Legacy APK
        run: bash module-legacy/build.sh

      - name: Build Universal APK
        run: bash module-universal/build.sh

      - name: Run feature-hook registry regression
        run: |
          set -e
          OUT=build/feature-hook-registry-test
          KOTLIN_RUNTIME_JAR=module-kotlin-runtime/build/libs/dsh-kotlin-runtime-0.1.0.jar
          KOTLIN_STDLIB_JAR="$(find module-kotlin-runtime/build/runtime-classpath -maxdepth 1 \
            -type f -name 'kotlin-stdlib-*.jar' -print | sort -V | tail -n 1)"
          test -s "$KOTLIN_RUNTIME_JAR"
          test -s "$KOTLIN_STDLIB_JAR"
          mkdir -p "$OUT"
          javac -source 8 -target 8 \
            -cp "$KOTLIN_RUNTIME_JAR:$KOTLIN_STDLIB_JAR" \
            -d "$OUT" \
            module/tests/ds/dsh/DeepSeek/FeatureHookInstallRegistryRegressionTest.java
          java -cp "$OUT:$KOTLIN_RUNTIME_JAR:$KOTLIN_STDLIB_JAR" \
            ds.dsh.DeepSeek.FeatureHookInstallRegistryRegressionTest

      - name: Build Compose Launcher debug APK
        working-directory: compose-launcher
        run: |
          set -e
          sed -i '/^[[:space:]]*android\.aapt2FromMavenOverride[[:space:]]*=/d' gradle.properties
          gradle --no-daemon --stacktrace \
            -PprotectedBuild=false \
            -PlocalApiIncluded=false \
            -PandroidCompileSdk=37 \
            :app:assembleDebug

      - name: Check that APK files were produced
        run: |
          set -e
          test -s module-legacy/ds-probe-legacy.apk
          test -s module-universal/ds-probe-universal.apk
          test -s compose-launcher/app/build/outputs/apk/debug/app-debug.apk
          for apk in \
            module-legacy/ds-probe-legacy.apk \
            module-universal/ds-probe-universal.apk \
            compose-launcher/app/build/outputs/apk/debug/app-debug.apk; do
            unzip -t "$apk" >/dev/null
            echo "APK produced: $apk ($(du -h "$apk" | cut -f1))"
          done

      - name: Upload APK artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yunseek-android-apks
          path: |
            module-legacy/ds-probe-legacy.apk
            module-universal/ds-probe-universal.apk
            compose-launcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
