name: Activation and Hook Bootstrap Regression

on:
  push:
    branches:
      - fix/activation-evidence-and-bootstrap
  pull_request:
    branches:
      - dev
    paths:
      - "module/src/com/dsmod/probe/Main.java"
      - "module/src/com/dsmod/probe/SettingsActivity.java"
      - "module/src/com/dsmod/probe/XposedActivationProvider.java"
      - "module/src/com/dsmod/probe/ActivationStatusPolicy.java"
      - "module-legacy/compat/com/dsmod/probe/LegacyXposedModule.java"
      - "module/tests/com/dsmod/probe/ActivationStatusPolicyRegressionTest.java"
      - "module/test-activation-status.sh"
      - ".github/workflows/activation-and-hook-regression.yml"

permissions:
  contents: read

jobs:
  activation-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Run activation and hook bootstrap regression checks
        run: bash module/test-activation-status.sh

  android-open-debug-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"
      - name: Install Android SDK components
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Create ephemeral CI debug signing key
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt \
            -keystore module/debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000
      - name: Assemble Open debug APK
        working-directory: compose-launcher
        run: |
          set -euo pipefail
          sed -i '/^[[:space:]]*android\.aapt2FromMavenOverride[[:space:]]*=/d' gradle.properties
          gradle --no-daemon --stacktrace \
            -PprotectedBuild=false \
            -PlocalApiIncluded=false \
            -PandroidCompileSdk=36 \
            :app:assembleDebug
      - name: Compile and package legacy Xposed APK
        run: |
          set -euo pipefail
          bash module-legacy/build.sh
          test -s module-legacy/ds-probe-legacy.apk
