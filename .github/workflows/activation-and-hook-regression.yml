name: Activation and Hook Bootstrap Regression

on:
  push:
    branches:
      - fix/activation-evidence-and-bootstrap
  pull_request:
    branches:
      - dev
    paths:
      - "module/src/com/dsmod/probe/Main.java"
      - "module/src/com/dsmod/probe/SettingsActivity.java"
      - "module/src/com/dsmod/probe/XposedActivationProvider.java"
      - "module/src/com/dsmod/probe/ActivationStatusPolicy.java"
      - "module-legacy/compat/com/dsmod/probe/LegacyXposedModule.java"
      - "module/tests/com/dsmod/probe/ActivationStatusPolicyRegressionTest.java"
      - "module/test-activation-status.sh"
      - ".github/workflows/activation-and-hook-regression.yml"

permissions:
  contents: read

jobs:
  activation-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Run activation and hook bootstrap regression checks
        run: bash module/test-activation-status.sh
