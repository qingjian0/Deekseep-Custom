name: Activation and Xposed bootstrap regression

on:
  pull_request:
    branches: [dev]
    paths:
      - "module/src/com/dsmod/probe/Main.java"
      - "module/src/com/dsmod/probe/SettingsActivity.java"
      - "module/src/com/dsmod/probe/XposedActivationProvider.java"
      - "module/src/com/dsmod/probe/ActivationStatusPolicy.java"
      - "module/tests/com/dsmod/probe/ActivationStatusPolicyRegressionTest.java"
      - "module/test-activation-regression.sh"
      - ".github/workflows/activation-regression.yml"
  push:
    branches: [dev]
    paths:
      - "module/src/com/dsmod/probe/Main.java"
      - "module/src/com/dsmod/probe/SettingsActivity.java"
      - "module/src/com/dsmod/probe/XposedActivationProvider.java"
      - "module/src/com/dsmod/probe/ActivationStatusPolicy.java"
      - "module/tests/com/dsmod/probe/ActivationStatusPolicyRegressionTest.java"
      - "module/test-activation-regression.sh"
      - ".github/workflows/activation-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-open-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"
      - name: Install Android SDK components
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Generate ephemeral validation-only debug keystore
        run: |
          set -euo pipefail
          mkdir -p module
          if [ ! -s module/debug.keystore ]; then
            keytool -genkeypair -v -keystore module/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Assemble Open validation APK (no release publication)
        working-directory: compose-launcher
        run: |
          set -euo pipefail
          sed -i '/^[[:space:]]*android\.aapt2FromMavenOverride[[:space:]]*=/d' gradle.properties
          gradle --no-daemon --stacktrace -PprotectedBuild=false -PlocalApiIncluded=false -PandroidCompileSdk=36 :app:assembleRelease
      - name: Verify APK package identity and structure
        working-directory: .
        run: |
          set -euo pipefail
          APK="compose-launcher/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.dsmod.probe'"
          test "$(unzip -p "$APK" assets/xposed_init)" = "com.dsmod.probe.Main"
      - uses: actions/upload-artifact@v4
        with:
          name: YunSeek-open-validation-apk
          path: compose-launcher/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
  activation-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Run activation and bootstrap regression tests
        run: bash module/test-activation-regression.sh
