name: DeepSeek APK read-only intake

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/deepseek-apk-intake.yml'
      - 'scripts/inspect-deepseek-apk.py'
      - 'module/src/ds/dsh/DeepSeek/RoiDexApkCli.java'
      - 'module/src/ds/dsh/DeepSeek/RoiDexCandidateEvidence.java'
      - 'module/src/ds/dsh/DeepSeek/RoiDexInstructionDecoder.java'
      - 'module/test-roi-dex-instruction-decoder.sh'
      - 'module/tests/roidexdecoder/ds/dsh/DeepSeek/RoiDexInstructionDecoderTest.java'
      - 'module/src/ds/dsh/DeepSeek/RoiDexRegisterFlowAnalyzer.java'
      - 'module/test-roi-apk-cli-budget.sh'
      - 'module/test-roi-dex-register-flow.sh'
      - 'module/tests/roidexregisterflow/ds/dsh/DeepSeek/RoiDexRegisterFlowAnalyzerTest.java'
  workflow_dispatch:
    inputs:
      apk_url:
        description: Public direct-download URL for a single APK
        required: true
        default: https://raw.githubusercontent.com/qingjian0/apps/main/DeepSeek_2.7.5.apk
        type: string
      expected_version:
        description: Expected versionName
        required: true
        default: "2.7.5"
        type: string

permissions:
  contents: read

concurrency:
  group: deepseek-apk-intake-${{ github.ref }}
  cancel-in-progress: false

jobs:
  intake:
    name: Validate APK and extract DEX (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out dev source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Run DEX instruction decoder regression tests
        run: |
          set -euo pipefail
          bash module/test-roi-dex-instruction-decoder.sh

      - name: Run DEX register-flow regression tests
        run: |
          set -euo pipefail
          bash module/test-roi-dex-register-flow.sh

      - name: Run APK CLI traversal budget regression tests
        run: |
          set -euo pipefail
          bash module/test-roi-apk-cli-budget.sh

      - name: Install Android Build Tools
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "build-tools;37.0.0"

      - name: Download selected APK
        env:
          APK_URL: ${{ inputs.apk_url || 'https://raw.githubusercontent.com/qingjian0/apps/main/DeepSeek_2.7.5.apk' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/deepseek-apk"
          curl --fail --location --retry 3 --retry-delay 2 \
            --proto '=https' --tlsv1.2 \
            "$APK_URL" -o "$RUNNER_TEMP/deepseek-apk/DeepSeek.apk"
          test -s "$RUNNER_TEMP/deepseek-apk/DeepSeek.apk"

      - name: Validate package and extract DEX
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version || '2.7.5' }}
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/inspect-deepseek-apk.py
          python3 scripts/inspect-deepseek-apk.py \
            --apk "$RUNNER_TEMP/deepseek-apk/DeepSeek.apk" \
            --out "$RUNNER_TEMP/deepseek-apk/output" \
            --aapt "$ANDROID_SDK_ROOT/build-tools/37.0.0/aapt" \
            --expected-package "com.deepseek.chat" \
            --expected-version "$EXPECTED_VERSION"

      - name: Compile standalone ROI DEX scanner
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          OUT="$RUNNER_TEMP/roi-cli"
          mkdir -p "$OUT"
          javac -source 8 -target 8 -nowarn -d "$OUT" \
            "$ROOT/module/src/ds/dsh/DeepSeek/RoiDexDataReader.java" \
            "$ROOT/module/src/ds/dsh/DeepSeek/RoiDexInstructionDecoder.java" \
            "$ROOT/module/src/ds/dsh/DeepSeek/RoiDexCodeReader.java" \
            "$ROOT/module/src/ds/dsh/DeepSeek/RoiDexFileReader.java" \
            "$ROOT/module/src/ds/dsh/DeepSeek/RoiDexKitExportReader.java" \
            "$ROOT/module/src/ds/dsh/DeepSeek/RoiDexInstructionScanner.java" \
            "$ROOT/module/src/ds/dsh/DeepSeek/RoiDexExceptionControlFlow.java" \
            "$ROOT/module/src/ds/dsh/DeepSeek/RoiDexRegisterFlowAnalyzer.java" \
            "$ROOT/module/src/ds/dsh/DeepSeek/RoiDexReachingDefinitions.java" \
            "$ROOT/module/src/ds/dsh/DeepSeek/RoiDexMethodEntryLayout.java" \
            "$ROOT/module/src/ds/dsh/DeepSeek/RoiDexUseDefChains.java" \
            "$ROOT/module/src/ds/dsh/DeepSeek/RoiDexMethodAnalysis.java" \
            "$ROOT/module/src/ds/dsh/DeepSeek/RoiCandidateGraph.java" \
            "$ROOT/module/src/ds/dsh/DeepSeek/RoiDexCandidateEvidence.java" \
            "$ROOT/module/src/ds/dsh/DeepSeek/RoiDexApkCli.java"

      - name: Run bounded read-only ROI scan on each DEX
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/deepseek-apk/output"
          mkdir -p "$OUT/roi"
          count=0
          while IFS= read -r -d '' dex; do
            name="$(basename "$dex")"
            java -cp "$RUNNER_TEMP/roi-cli" ds.dsh.DeepSeek.RoiDexApkCli \
              "$dex" "$OUT/roi/$name.json" "$OUT/dex"
            count=$((count + 1))
          done < <(find "$OUT/dex" -maxdepth 1 -type f -name 'classes*.dex' -print0 | sort -z)
          test "$count" -gt 0
          echo "ROI scanned $count DEX file(s); Hook authorization remains disabled."

      - name: Upload intake and ROI reports only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deepseek-2.7.5-apk-roi-report
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ runner.temp }}/deepseek-apk/output/intake-report.json
            ${{ runner.temp }}/deepseek-apk/output/roi/*.json
