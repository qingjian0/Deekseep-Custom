name: ROI Universal Hook Runtime
on:
  push:
    branches: ["work/roi-universal-hook-r1-r9"]
    paths:
      - "module/src/ds/dsh/DeepSeek/RoiUniversalHookRuntime.java"
      - "module/src/ds/dsh/DeepSeek/RoiHookResolverActivationGate.java"
      - "module/src/ds/dsh/DeepSeek/RoiHostArtifactFingerprint.java"
      - "module/src/ds/dsh/DeepSeek/RoiHostBuildIdentity.java"
      - "module/src/ds/dsh/DeepSeek/RoiAndroidHostIdentity.java"
      - "module/tests/roihostidentity/**"
      - "module/tests/roiartifact/**"
      - "module/src/ds/dsh/DeepSeek/RoiRuntimeInvocationObserver.java"
      - "module/src/ds/dsh/DeepSeek/RoiRuntimeInvocationRecorder.java"
      - "module/src/ds/dsh/DeepSeek/HookAttachmentPipeline.java"
      - "module/src/ds/dsh/DeepSeek/HookChatPipeline.java"
      - "module/src/ds/dsh/DeepSeek/RoiDexKitDiscovery.java"
      - "module/src/ds/dsh/DeepSeek/Main.java"
      - "module-legacy/compat/ds/dsh/DeepSeek/LegacyXposedModule.java"
      - "module-legacy/test-adapter-regression.sh"
      - "module-legacy/tests/**"
      - "module-legacy/src/de/robv/android/xposed/**"
      - "module/tests/roiuniversalhook/**"
      - "module/tests/roiresolveractivationgate/**"
      - "module/tests/roiruntime/**"
      - "module/test-roi-runtime-recorder.sh"
      - "module/test-roi-universal-hook-runtime.sh"
      - "docs/architecture/ROI_UNIVERSAL_HOOK_RUNTIME.md"
      - "docs/architecture/ROI_UNIVERSAL_HOOK_MIGRATION_LEDGER.md"
      - ".github/workflows/roi-universal-hook.yml"
  pull_request:
    branches: [dev]
    paths:
      - "module/src/ds/dsh/DeepSeek/RoiUniversalHookRuntime.java"
      - "module/src/ds/dsh/DeepSeek/RoiHostArtifactFingerprint.java"
      - "module/src/ds/dsh/DeepSeek/RoiHostBuildIdentity.java"
      - "module/src/ds/dsh/DeepSeek/RoiAndroidHostIdentity.java"
      - "module/tests/roihostidentity/**"
      - "module/tests/roiartifact/**"
      - "module/src/ds/dsh/DeepSeek/RoiRuntimeInvocationObserver.java"
      - "module/src/ds/dsh/DeepSeek/RoiRuntimeInvocationRecorder.java"
      - "module/src/ds/dsh/DeepSeek/HookAttachmentPipeline.java"
      - "module/src/ds/dsh/DeepSeek/HookChatPipeline.java"
      - "module/src/ds/dsh/DeepSeek/RoiDexKitDiscovery.java"
      - "module/tests/roiruntime/**"
      - "module/test-roi-runtime-recorder.sh"
      - "module/tests/roiuniversalhook/**"
      - "module/test-roi-universal-hook-runtime.sh"
      - "docs/architecture/ROI_UNIVERSAL_HOOK_RUNTIME.md"
      - "docs/architecture/ROI_UNIVERSAL_HOOK_MIGRATION_LEDGER.md"
      - ".github/workflows/roi-universal-hook.yml"
permissions:
  contents: read
jobs:
  roi-universal-hook-jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: "21"
      - name: Shell syntax
        run: |
          bash -n module/test-roi-universal-hook-runtime.sh
          bash -n module/test-roi-runtime-recorder.sh
      - name: Run runtime invocation recorder tests
        run: bash module/test-roi-runtime-recorder.sh
      - name: Run isolated universal Hook tests
        run: bash module/test-roi-universal-hook-runtime.sh
      - name: Run legacy Xposed adapter regression matrix
        run: bash module-legacy/test-adapter-regression.sh
