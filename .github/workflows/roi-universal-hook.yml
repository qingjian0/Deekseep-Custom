name: ROI Universal Hook Runtime
concurrency:
  group: roi-universal-hook-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
on:
  push:
    branches: ["work/roi-hook", "work/generic-hook-lifecycle-dev", "work/cross-version-semantic-hook-resolver", "work/roi-serializer-integrity"]
    paths:
      - "module/src/ds/dsh/DeepSeek/RoiUniversalHookRuntime.java"
      - "module-kotlin-runtime/src/main/kotlin/ds/dsh/DeepSeek/HookLifecycleManager.kt"
      - "module-kotlin-runtime/src/test/kotlin/ds/dsh/DeepSeek/HookLifecycleManagerTest.kt"
      - "module/src/ds/dsh/DeepSeek/RoiSemanticProfileMatcher.java"
      - "module/tests/roiprofilematcher/**"
      - "module/test-roi-semantic-profile-matcher.sh"
      - "module/src/ds/dsh/DeepSeek/RoiDexSerializerPipeline.java"
      - "module/src/ds/dsh/DeepSeek/RoiDexSerializerMapper.java"
      - "module/src/ds/dsh/DeepSeek/RoiDexSerializerElementIndex.java"
      - "module/src/ds/dsh/DeepSeek/RoiDexCandidateEvidence.java"
      - "module/src/ds/dsh/DeepSeek/RoiDexValueProvenance.java"
      - "module/src/ds/dsh/DeepSeek/RoiDexInvokeResultLinker.java"
      - "module/tests/roidexserializerpipeline/**"
      - "module/tests/roidexserializermapper/**"
      - "module/test-roi-serializer-pipeline.sh"
      - "module/src/ds/dsh/DeepSeek/RoiHookResolverActivationGate.java"
      - "module/src/ds/dsh/DeepSeek/RoiHostArtifactFingerprint.java"
      - "module/src/ds/dsh/DeepSeek/RoiHostBuildIdentity.java"
      - "module/src/ds/dsh/DeepSeek/RoiAndroidHostIdentity.java"
      - "module/src/ds/dsh/DeepSeek/RoiReviewedHookEvidenceRegistry.java"
      - "module/src/ds/dsh/DeepSeek/RoiRuntimeInvocationObserver.java"
      - "module/src/ds/dsh/DeepSeek/RoiRuntimeInvocationRecorder.java"
      - "module/src/ds/dsh/DeepSeek/RoiDexKitDiscovery.java"
      - "module/src/ds/dsh/DeepSeek/Main.java"
      - "module/src/ds/dsh/DeepSeek/HookAttachmentPipeline.java"
      - "module/src/ds/dsh/DeepSeek/HookChatPipeline.java"
      - "module-kotlin-runtime/src/main/kotlin/ds/dsh/DeepSeek/FeatureHookInstallRegistry.kt"
      - "module-legacy/compat/ds/dsh/DeepSeek/LegacyXposedModule.java"
      - "module-legacy/test-adapter-regression.sh"
      - "module-legacy/tests/**"
      - "module-legacy/src/de/robv/android/xposed/**"
      - "module/tests/roiartifact/**"
      - "module/tests/roihostidentity/**"
      - "module/tests/roiresolveractivationgate/**"
      - "module/tests/roireviewedevidence/**"
      - "module/tests/roiruntime/**"
      - "module/tests/roiuniversalhook/**"
      - "module/tests/ds/dsh/DeepSeek/FeatureHookInstallRegistryRegressionTest.java"
      - "module/test/ds/dsh/DeepSeek/FeatureHookInstallRegistryRegression.java"
      - "module/test-hook-install-registry.sh"
      - "module/test-roi-runtime-recorder.sh"
      - "module/test-roi-universal-hook-runtime.sh"
      - "docs/architecture/ROI_UNIVERSAL_HOOK_RUNTIME.md"
      - "docs/architecture/ROI_UNIVERSAL_HOOK_MIGRATION_LEDGER.md"
      - ".github/workflows/roi-universal-hook.yml"
  pull_request:
    branches: [dev, "work/roi-hook", "work/generic-hook-lifecycle-dev"]
    paths:
      - "module/src/ds/dsh/DeepSeek/RoiUniversalHookRuntime.java"
      - "module-kotlin-runtime/src/main/kotlin/ds/dsh/DeepSeek/HookLifecycleManager.kt"
      - "module-kotlin-runtime/src/test/kotlin/ds/dsh/DeepSeek/HookLifecycleManagerTest.kt"
      - "module/src/ds/dsh/DeepSeek/RoiSemanticProfileMatcher.java"
      - "module/tests/roiprofilematcher/**"
      - "module/test-roi-semantic-profile-matcher.sh"
      - "module/src/ds/dsh/DeepSeek/RoiDexSerializerPipeline.java"
      - "module/src/ds/dsh/DeepSeek/RoiDexSerializerMapper.java"
      - "module/src/ds/dsh/DeepSeek/RoiDexSerializerElementIndex.java"
      - "module/src/ds/dsh/DeepSeek/RoiDexCandidateEvidence.java"
      - "module/src/ds/dsh/DeepSeek/RoiDexValueProvenance.java"
      - "module/src/ds/dsh/DeepSeek/RoiDexInvokeResultLinker.java"
      - "module/tests/roidexserializerpipeline/**"
      - "module/tests/roidexserializermapper/**"
      - "module/test-roi-serializer-pipeline.sh"
      - "module/src/ds/dsh/DeepSeek/RoiHookResolverActivationGate.java"
      - "module/src/ds/dsh/DeepSeek/RoiHostArtifactFingerprint.java"
      - "module/src/ds/dsh/DeepSeek/RoiHostBuildIdentity.java"
      - "module/src/ds/dsh/DeepSeek/RoiAndroidHostIdentity.java"
      - "module/src/ds/dsh/DeepSeek/RoiReviewedHookEvidenceRegistry.java"
      - "module/src/ds/dsh/DeepSeek/RoiRuntimeInvocationObserver.java"
      - "module/src/ds/dsh/DeepSeek/RoiRuntimeInvocationRecorder.java"
      - "module/src/ds/dsh/DeepSeek/RoiDexKitDiscovery.java"
      - "module/src/ds/dsh/DeepSeek/Main.java"
      - "module/src/ds/dsh/DeepSeek/HookAttachmentPipeline.java"
      - "module/src/ds/dsh/DeepSeek/HookChatPipeline.java"
      - "module-kotlin-runtime/src/main/kotlin/ds/dsh/DeepSeek/FeatureHookInstallRegistry.kt"
      - "module-legacy/compat/ds/dsh/DeepSeek/LegacyXposedModule.java"
      - "module-legacy/test-adapter-regression.sh"
      - "module-legacy/tests/**"
      - "module-legacy/src/de/robv/android/xposed/**"
      - "module/tests/roiartifact/**"
      - "module/tests/roihostidentity/**"
      - "module/tests/roiresolveractivationgate/**"
      - "module/tests/roireviewedevidence/**"
      - "module/tests/roiruntime/**"
      - "module/tests/roiuniversalhook/**"
      - "module/tests/ds/dsh/DeepSeek/FeatureHookInstallRegistryRegressionTest.java"
      - "module/test/ds/dsh/DeepSeek/FeatureHookInstallRegistryRegression.java"
      - "module/test-hook-install-registry.sh"
      - "module/test-roi-runtime-recorder.sh"
      - "module/test-roi-universal-hook-runtime.sh"
      - "docs/architecture/ROI_UNIVERSAL_HOOK_RUNTIME.md"
      - "docs/architecture/ROI_UNIVERSAL_HOOK_MIGRATION_LEDGER.md"
      - ".github/workflows/roi-universal-hook.yml"
permissions:
  contents: read
jobs:
  roi-universal-hook-jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: "21"
      - name: Shell syntax
        run: |
          bash -n module/test-roi-universal-hook-runtime.sh
          if [[ -f module/test-roi-semantic-profile-matcher.sh ]]; then
            bash -n module/test-roi-semantic-profile-matcher.sh
          fi
          if [[ -f module/test-roi-serializer-pipeline.sh ]]; then
            bash -n module/test-roi-serializer-pipeline.sh
          fi
          bash -n module/test-roi-runtime-recorder.sh
          bash -n module/test-hook-install-registry.sh
          bash -n module-legacy/test-adapter-regression.sh
      - name: Run Kotlin lifecycle manager tests
        if: ${{ hashFiles('module-kotlin-runtime/src/test/kotlin/ds/dsh/DeepSeek/HookLifecycleManagerTest.kt') != '' }}
        run: |
          set -euo pipefail
          GRADLE_BIN="$(bash scripts/gradle-bootstrap.sh)"
          "$GRADLE_BIN" --no-daemon --stacktrace -p module-kotlin-runtime test
      - name: Run semantic profile matcher tests
        if: ${{ hashFiles('module/test-roi-semantic-profile-matcher.sh') != '' }}
        run: bash module/test-roi-semantic-profile-matcher.sh
      - name: Run serializer pipeline and mapper tests
        if: ${{ hashFiles('module/test-roi-serializer-pipeline.sh') != '' }}
        run: bash module/test-roi-serializer-pipeline.sh
      - name: Run runtime invocation recorder tests
        run: bash module/test-roi-runtime-recorder.sh
      - name: Run feature install registry tests
        run: bash module/test-hook-install-registry.sh
      - name: Run isolated universal Hook tests
        run: bash module/test-roi-universal-hook-runtime.sh
      - name: Run legacy Xposed adapter regression matrix
        run: bash module-legacy/test-adapter-regression.sh
