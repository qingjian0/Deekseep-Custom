name: Package identity regression

on:
  pull_request:
    branches: [dev]
    paths:
      - "compose-launcher/app/build.gradle.kts"
      - "compose-launcher/app/src/main/AndroidManifest.xml"
      - "module/src/**"
      - "module-legacy/AndroidManifest.xml"
      - "module-legacy/assets/xposed_init"
      - "module-universal/AndroidManifest.xml"
      - "module-universal/assets/xposed_init"
      - "scripts/test-package-identity.sh"
      - ".github/workflows/package-identity.yml"
  push:
    branches: [dev]
    paths:
      - "compose-launcher/app/build.gradle.kts"
      - "compose-launcher/app/src/main/AndroidManifest.xml"
      - "module/src/**"
      - "module-legacy/AndroidManifest.xml"
      - "module-legacy/assets/xposed_init"
      - "module-universal/AndroidManifest.xml"
      - "module-universal/assets/xposed_init"
      - "scripts/test-package-identity.sh"
      - ".github/workflows/package-identity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-open-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"
      - name: Install Android SDK components
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Assemble Open validation APK (no release publication)
        working-directory: compose-launcher
        run: |
          set -euo pipefail
          sed -i '/^[[:space:]]*android\.aapt2FromMavenOverride[[:space:]]*=/d' gradle.properties
          gradle --no-daemon --stacktrace -PprotectedBuild=false -PlocalApiIncluded=false -PandroidCompileSdk=36 :app:assembleRelease
      - name: Verify APK package identity and structure
        working-directory: .
        run: |
          set -euo pipefail
          APK="compose-launcher/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "package: name='ds.dsh.DeepSeek'"
          test "$(unzip -p "$APK" assets/xposed_init)" = "ds.dsh.DeepSeek.Main"
      - uses: actions/upload-artifact@v4
        with:
          name: YunSeek-open-validation-apk
          path: compose-launcher/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
  package-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify application id and Xposed entry identity
        run: bash scripts/test-package-identity.sh
