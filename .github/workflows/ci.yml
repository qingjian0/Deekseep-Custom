name: YunSeek CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev, "work/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yunseek-ci-${{ github.workflow }}-${{ github.ref }}
  # Preserve an active validation run while retaining only the newest queued run.
  cancel-in-progress: false

jobs:

  roi-fast-audit:
    name: ROI fast audit (0.5)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Run focused ROI audit
        run: |
          set -euo pipefail
          bash -n module/test-roi-dex-instruction-decoder.sh
          bash -n module/test-roi-hook-resolver.sh
          bash -n module/test-roi-dexkit-discovery.sh
          bash -n module/test-roi-candidate-graph.sh
          bash -n module/test-roi-candidate-identity.sh
          bash -n module/test-roi-class-loader-profile.sh
          bash -n module/test-roi-loaded-class-inspector.sh
          bash -n module/test-roi-class-load-observer.sh
          bash -n module/test-roi-discovery-budget.sh
          bash -n module/test-roi-semantic-role-hints.sh
          bash -n module/test-roi-functional-role-classifier.sh
          bash -n module/test-roi-class-candidate-matcher.sh
          bash -n module/test-roi-unknown-host-hook-policy.sh
          bash -n module/test-roi-unknown-host-invocation-probe.sh
          bash -n module/test-roi-unknown-host-invocation-wiring.sh
          bash -n module/test-roi-unknown-host-auto-probe.sh
          bash -n module/test-roi-unknown-host-chat-request.sh
          bash -n module/test-roi-unknown-host-chat-request-wiring.sh
          bash -n module/test-roi-runtime-recorder.sh
          bash module/test-roi-dex-instruction-decoder.sh
          bash module/test-roi-hook-resolver.sh
          bash module/test-roi-dexkit-discovery.sh
          bash module/test-roi-candidate-graph.sh
          bash module/test-roi-candidate-identity.sh
          bash module/test-roi-class-loader-profile.sh
          bash module/test-roi-loaded-class-inspector.sh
          bash module/test-roi-class-load-observer.sh
          bash module/test-roi-discovery-budget.sh
          bash module/test-roi-semantic-role-hints.sh
          bash module/test-roi-functional-role-classifier.sh
          bash module/test-roi-runtime-recorder.sh
          bash module/test-roi-unknown-host-invocation-probe.sh
          bash module/test-roi-unknown-host-invocation-wiring.sh
          bash module/test-roi-unknown-host-auto-probe.sh
          bash module/test-roi-unknown-host-chat-request.sh
          bash module/test-roi-unknown-host-chat-request-wiring.sh

  regression:
    name: Regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "platforms;android-36" "platforms;android-37.0" "build-tools;35.0.0" "build-tools;36.0.0" "build-tools;37.0.0"

      - name: Run source-only regression checks
        run: |
          set -euo pipefail
          for script in scripts/gradle-open-debug.sh scripts/build-all.sh \
              scripts/test-package-identity.sh scripts/test-universal-feature-parity.sh \
              module-legacy/test-adapter-regression.sh module/test-target-process-guard.sh \
              module/test-hostmap-regression.sh module/test-local-api-network-regression.sh \
              module/test-native-adapter-fail-closed.sh module/test-roi-hook-resolver.sh scripts/package-dexkit-native.sh scripts/test-dexkit-integration.sh \
              module/test-roi-dexkit-discovery.sh module/test-roi-candidate-graph.sh \
              module/test-roi-semantic-role-hints.sh module/test-roi-functional-role-classifier.sh module/test-roi-class-candidate-matcher.sh module/test-roi-unknown-host-hook-policy.sh module/test-roi-unknown-host-invocation-probe.sh module/test-roi-unknown-host-invocation-wiring.sh module/test-roi-unknown-host-auto-probe.sh module/test-roi-unknown-host-chat-request.sh module/test-roi-unknown-host-chat-request-wiring.sh module/test-roi-runtime-recorder.sh \
              module/test-roi-candidate-identity.sh module/test-roi-class-loader-profile.sh module/test-roi-loaded-class-inspector.sh module/test-roi-class-load-observer.sh module/test-roi-functional-role-classifier.sh module/test-roi-discovery-budget.sh; do
            bash -n "$script"
          done
          GRADLE_BIN="$(bash scripts/gradle-bootstrap.sh)"
          "$GRADLE_BIN" --no-daemon --stacktrace -p module-kotlin-runtime test stageDexKitArtifacts
          DEXKIT_STAGE="module-kotlin-runtime/build/dexkit-stage"
          test -s "$DEXKIT_STAGE/libs/dexkit-2.3.0.jar"
          test -s "$DEXKIT_STAGE/libs/flatbuffers-java-23.5.26.jar"
          find "$DEXKIT_STAGE/native-dependencies" -type f -name 'cxx-1.2.0.aar' -print -quit | grep -q .
          test -d "$DEXKIT_STAGE/cxx-prefab/prefab"
          test -s "$DEXKIT_STAGE/jni/arm64-v8a/libdexkit.so"
          find "$DEXKIT_STAGE/jni" -type f -name '*.so' -print
          python3 -m py_compile scripts/verify-elf-load-alignment.py scripts/verify-dexkit-apk.py scripts/verify-dexkit-gradle-apk.py
          bash scripts/test-dexkit-integration.sh
          bash module/test-roi-dexkit-discovery.sh
          bash module/test-roi-candidate-graph.sh
          bash module/test-roi-candidate-identity.sh
          bash module/test-roi-class-loader-profile.sh
          bash module/test-roi-loaded-class-inspector.sh
          bash module/test-roi-class-load-observer.sh
          bash module/test-roi-class-candidate-matcher.sh
          bash module/test-roi-unknown-host-hook-policy.sh
          bash module/test-roi-unknown-host-invocation-probe.sh
          bash module/test-roi-unknown-host-auto-probe.sh
          bash module/test-roi-unknown-host-chat-request.sh
          bash module/test-roi-unknown-host-chat-request-wiring.sh
          bash module/test-roi-discovery-budget.sh
          bash module/test-roi-semantic-role-hints.sh
          bash module/test-roi-functional-role-classifier.sh
          bash module/test-roi-runtime-recorder.sh
          bash module/test-roi-hook-resolver.sh
          mapfile -t DEXKIT_NATIVE_LIBS < <(find "$DEXKIT_STAGE/jni" -type f -name 'libdexkit.so' | sort)
          test "${#DEXKIT_NATIVE_LIBS[@]}" -gt 0
          python3 scripts/verify-elf-load-alignment.py "${DEXKIT_NATIVE_LIBS[@]}"
          for native_lib in "${DEXKIT_NATIVE_LIBS[@]}"; do
            echo "Dynamic dependencies for $native_lib:"
            readelf -d "$native_lib" | grep '(NEEDED)' || true
          done
          echo "CXX Prefab native payload inventory:"
          find "$DEXKIT_STAGE/cxx-prefab/prefab" -type f \( -name '*.so' -o -name '*.a' \) -print | sort
          bash scripts/test-package-identity.sh
          bash module-legacy/test-adapter-regression.sh
          bash module-legacy/build.sh
          python3 scripts/verify-dexkit-apk.py module-legacy/ds-probe-legacy.apk "$DEXKIT_STAGE"
          bash module/test-expert-relay-regression.sh
          bash module/test-language-catalog.sh
          bash module/test-target-process-guard.sh
          bash module/test-hostmap-regression.sh
          bash module/test-hook-install-registry.sh
          bash module/test-local-api-network-regression.sh
          bash module/test-native-adapter-fail-closed.sh

      - name: Build traditional Xposed core for regression tests
        run: |
          set -euo pipefail
          bash module-universal/build.sh

      - name: Run host compatibility and feature regression tests
        run: |
          set -euo pipefail
          bash module/test-port-v271.sh
          bash module/test-thinking-regression.sh
          GOOGLE_PLAY_BUILD=true bash module-universal/build.sh
          python3 scripts/verify-dexkit-apk.py module-universal/ds-probe-universal-google-play.apk module-kotlin-runtime/build/dexkit-stage
          export AAPT2="$ANDROID_SDK_ROOT/build-tools/37.0.0/aapt2"
          bash scripts/test-universal-feature-parity.sh

  android:
    name: Android Open build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/module/debug.keystore
      ANDROID_STORE_PASSWORD: android
      ANDROID_KEY_ALIAS: androiddebugkey
      ANDROID_KEY_PASSWORD: android
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          gradle-version: "9.8.2"

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;37.0.0"

      - name: Create ephemeral CI-only debug signing key
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt \
            -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass "$ANDROID_STORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            -dname "CN=YunSeek CI Temporary Key,O=CI Only,C=US" \
            -keyalg RSA -keysize 2048 -validity 2
          echo "Created an ephemeral key for CI validation only; it is not a release key."

      - name: Build Open release and run Android Lint
        working-directory: compose-launcher
        run: |
          set -euo pipefail
          # Remove the developer's Termux-only AAPT2 override; CI uses the pinned SDK Build Tools.
          sed -i '/^[[:space:]]*android\.aapt2FromMavenOverride[[:space:]]*=/d' gradle.properties
          gradle --no-daemon --stacktrace \
            -PprotectedBuild=false \
            -PlocalApiIncluded=false \
            -PandroidCompileSdk=37 \
            :app:assembleRelease :app:lintRelease

      - name: Verify CI APK structure, alignment, and signature
        run: |
          set -euo pipefail
          APK="compose-launcher/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -Z1 "$APK" | grep -Fxq "AndroidManifest.xml"
          unzip -Z1 "$APK" | grep -E '^classes([0-9]+)?[.]dex$' >/dev/null
          python3 scripts/verify-dexkit-gradle-apk.py "$APK" compose-launcher/app/build.gradle.kts scripts/verify-elf-load-alignment.py
          "$ANDROID_SDK_ROOT/build-tools/37.0.0/zipalign" -c -p 4 "$APK"
          "$ANDROID_SDK_ROOT/build-tools/37.0.0/apksigner" verify --verbose "$APK"
          echo "Open release APK passed structural, alignment, and CI-key signature checks."

      - name: Upload verified Open release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yunseek-open-release-apk
          if-no-files-found: error
          path: compose-launcher/app/build/outputs/apk/release/app-release.apk

      - name: Upload Android Lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yunseek-android-lint-reports
          if-no-files-found: warn
          path: |
            compose-launcher/app/build/reports/lint-results-release*
            compose-launcher/app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/*
