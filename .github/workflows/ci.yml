name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev, refactor/kotlin-hook-architecture]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Basic regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Check shell syntax
        run: |
          set -euo pipefail
          for script in \
            module-legacy/test-adapter-regression.sh \
            module/test-hook-install-registry.sh \
            module/test-hook-installer-retry-regression.sh \
            module/test-target-process-guard.sh \
            scripts/test-package-identity.sh \
            scripts/test-launcher-activation-regression.sh \
            scripts/test-launcher-config-architecture.sh \
            scripts/test-launcher-backup-architecture.sh; do
            bash -n "$script"
          done

      - name: Run focused regressions
        run: |
          set -euo pipefail
          bash module-legacy/test-adapter-regression.sh
          bash module/test-hook-install-registry.sh
          bash module/test-hook-installer-retry-regression.sh
          bash module/test-target-process-guard.sh
          bash scripts/test-package-identity.sh
          bash scripts/test-launcher-activation-regression.sh
          bash scripts/test-launcher-config-architecture.sh
          bash scripts/test-launcher-backup-architecture.sh

  android-build:
    name: Build Android APKs
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          gradle-version: "9.8.2"

      - name: Build Legacy APK
        run: bash module-legacy/build.sh

      - name: Build domestic Universal APK
        run: bash module-universal/build.sh

      - name: Build Google Play Universal APK
        run: GOOGLE_PLAY_BUILD=true bash module-universal/build.sh

      - name: Build Compose Launcher APK
        working-directory: compose-launcher
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deekseep-custom-debug-apks
          if-no-files-found: warn
          retention-days: 7
          path: |
            module-legacy/ds-probe-legacy.apk
            module-universal/ds-probe-universal.apk
            module-universal/ds-probe-universal-google-play.apk
            compose-launcher/app/build/outputs/apk/debug/*.apk
