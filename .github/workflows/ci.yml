name: YunSeek CI (permissive)

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev, refactor/kotlin-hook-architecture, work/kotlin-logging-architecture]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yunseek-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-smoke:
    name: Basic source checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check shell script syntax
        run: |
          set -e
          for script in scripts/gradle-open-debug.sh scripts/build-all.sh \
              module-legacy/build.sh module-universal/build.sh; do
            if [ -f "$script" ]; then bash -n "$script"; fi
          done
          echo "Basic shell syntax checks passed."
      - name: Guard persistence and log rotation recovery paths
        run: |
          set -euo pipefail
          bash module/test-agent-tool-trace-store-persistence.sh
          bash module/test-log-rotation-rollback.sh

  android-open-debug:
    name: Android Open debug compile
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          gradle-version: "9.8.2"
      - name: Install Android SDK components
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Assemble Open debug APK
        working-directory: compose-launcher
        run: |
          set -euo pipefail
          sed -i '/^[[:space:]]*android\.aapt2FromMavenOverride[[:space:]]*=/d' gradle.properties
          gradle --no-daemon --stacktrace \
            -PprotectedBuild=false \
            -PlocalApiIncluded=false \
            -PandroidCompileSdk=36 \
            :app:assembleDebug
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          echo "Open debug APK compiled and archive integrity verified."
      - name: Run Kotlin runtime unit tests
        working-directory: module-kotlin-runtime
        run: gradle --no-daemon test
