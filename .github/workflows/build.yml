name: YunSeek 1.8.1 Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yunseek-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"

      # The project supports API 35+. Use the stable API 36 platform in CI;
      # API 37 is not published in the runner's SDK package repository.
      - name: Accept Android SDK licenses and install required components
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0"
          test -d "$ANDROID_SDK_ROOT/platforms/android-36"
          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2"
          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign"
          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"

      - name: Prepare Open debug signing key
        run: |
          set -euo pipefail
          mkdir -p module
          keytool -genkeypair -noprompt -v \
            -keystore module/debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -dname 'CN=Android Debug,O=Android,C=US' \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Build YunSeek Open edition
        working-directory: compose-launcher
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace \
            -PprotectedBuild=false \
            -PlocalApiIncluded=false \
            -PandroidCompileSdk=36 \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2" \
            :app:assembleDebug

      - name: Verify APK and prepare build output
        run: |
          set -euo pipefail
          APK="compose-launcher/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p out
          cp "$APK" out/YunSeek-1.8.1-debug.apk
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign" -c -p 4 out/YunSeek-1.8.1-debug.apk
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose out/YunSeek-1.8.1-debug.apk
          (cd out && sha256sum YunSeek-1.8.1-debug.apk > SHA256.txt)
          cat out/SHA256.txt

      # Publish the APK and checksum as individual GitHub Release assets.
      # The Release page exposes direct .apk downloads; Actions artifacts remain ZIP archives.
      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: yunseek-1.8.1-build-${{ github.run_number }}
          name: YunSeek 1.8.1 build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: |
            out/YunSeek-1.8.1-debug.apk
            out/SHA256.txt
          fail_on_unmatched_files: true

      - name: Upload APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: YunSeek-1.8.1-Android-debug
          path: |
            out/YunSeek-1.8.1-debug.apk
            out/SHA256.txt
          if-no-files-found: error
          retention-days: 30
