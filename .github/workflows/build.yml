name: YunSeek 1.8.1 Android signed build

on:
  push:
    branches: [main, refactor/full-package-ds-dsh-deepseek]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yunseek-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # Android Gradle Plugin 9.3.0 / Kotlin 2.4.x lint analysis uses
      # Java 21 SequencedCollection APIs (List.removeLast). JDK 17 causes
      # NoSuchMethodError during lintVitalAnalyzeRelease.
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"
          # Keep a writable branch cache so subsequent builds can reuse Gradle outputs.
          cache-read-only: false

      - name: Accept Android SDK licenses and install required components
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          if [ ! -d "$ANDROID_SDK_ROOT/platforms/android-36" ] || \
             [ ! -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" ] || \
             [ ! -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
          else
            echo "Android 36 platform and Build Tools 36.0.0 are already installed; skipping sdkmanager."
          fi
          test -d "$ANDROID_SDK_ROOT/platforms/android-36"
          test -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign"
          test -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"

      - name: Prepare private release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing repository secret: ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$ANDROID_STORE_PASSWORD" || { echo "Missing repository secret: ANDROID_STORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing repository secret: ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing repository secret: ANDROID_KEY_PASSWORD"; exit 1; }
          mkdir -p module
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > module/release.keystore
          test -s module/release.keystore
          keytool -list -keystore module/release.keystore \
            -storepass "$ANDROID_STORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/module/release.keystore" >> "$GITHUB_ENV"
          echo "ANDROID_STORE_PASSWORD=$ANDROID_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "Private signing keystore and alias verified."

      - name: Build YunSeek Open release
        working-directory: compose-launcher
        run: |
          set -euo pipefail
          # gradle.properties carries a Termux-only AAPT2 override. Remove it in CI so
          # AGP 9.3.0 resolves and uses its matching AAPT2 artifact instead of an older SDK binary.
          sed -i '/^[[:space:]]*android\.aapt2FromMavenOverride[[:space:]]*=/d' gradle.properties
          gradle --no-daemon --parallel --max-workers=4 --build-cache --stacktrace \
            -PprotectedBuild=false \
            -PlocalApiIncluded=false \
            -PandroidCompileSdk=36 \
            :app:assembleRelease

      - name: Verify ABI APKs, signatures and prepare release output
        run: |
          set -euo pipefail
          APK_DIR="compose-launcher/app/build/outputs/apk/release"
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          mkdir -p out

          verify_apk() {
            local source="$1" target="$2" expected_abis="$3"
            test -s "$source" || { echo "Missing APK: $source"; find compose-launcher/app/build/outputs/apk -type f -maxdepth 4 -print; exit 1; }
            unzip -t "$source" >/dev/null
            unzip -Z1 "$source" | grep -Fxq "AndroidManifest.xml"
            unzip -Z1 "$source" | grep -E '^classes([0-9]+)?[.]dex$' >/dev/null
            local actual_abis
            actual_abis="$(unzip -Z1 "$source" | sed -n 's#^lib/\\([^/]*/\\).*$#\\1#p' | sort -u | tr -d '\\n')"
            local expected_sorted
            expected_sorted="$(printf '%s\\n' $expected_abis | sort | tr -d '\\n')"
            test "$actual_abis" = "$expected_sorted" || {
              echo "ABI mismatch in $source: expected=[$expected_sorted], actual=[$actual_abis]"
              unzip -Z1 "$source" | grep '^lib/' || true
              exit 1
            }
            cp "$source" "out/$target"
            "$BUILD_TOOLS/zipalign" -c -p 4 "out/$target"
            "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "out/$target"
            echo "Verified $target (ABIs: $expected_sorted)"
          }

          verify_apk "$APK_DIR/app-arm64-v8a-release.apk" \
            "YunSeek-1.8.1-arm64-v8a.apk" "arm64-v8a"
          verify_apk "$APK_DIR/app-x86_64-release.apk" \
            "YunSeek-1.8.1-x86_64.apk" "x86_64"
          verify_apk "$APK_DIR/app-universal-release.apk" \
            "YunSeek-1.8.1-arm64-v8a+x86_64.apk" "arm64-v8a x86_64"

          (cd out && sha256sum *.apk > SHA256.txt)
          cat out/SHA256.txt
      - name: Publish signed APK download
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: yunseek-1.8.1-signed-build-${{ github.run_number }}
          name: YunSeek 1.8.1 signed build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: |
            out/YunSeek-1.8.1-arm64-v8a.apk
            out/YunSeek-1.8.1-x86_64.apk
            out/YunSeek-1.8.1-arm64-v8a+x86_64.apk
            out/SHA256.txt
          fail_on_unmatched_files: true

      - name: Upload signed APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: YunSeek-1.8.1-Android-signed-release
          path: |
            out/YunSeek-1.8.1-arm64-v8a.apk
            out/YunSeek-1.8.1-x86_64.apk
            out/YunSeek-1.8.1-arm64-v8a+x86_64.apk
            out/SHA256.txt
          if-no-files-found: error
          retention-days: 30
