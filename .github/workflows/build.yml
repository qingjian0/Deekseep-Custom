name: YunSeek 1.8.1 Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yunseek-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-37" "build-tools;35.0.0"

      - name: Prepare Open debug signing key
        run: |
          mkdir -p module
          keytool -genkeypair -v \
            -keystore module/debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -dname 'CN=Android Debug,O=Android,C=US' \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Build YunSeek Open edition
        working-directory: compose-launcher
        run: |
          gradle --no-daemon \
            -PprotectedBuild=false \
            -PlocalApiIncluded=false \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2" \
            :app:assembleDebug

      - name: Verify APK and prepare build output
        run: |
          set -euo pipefail
          APK="compose-launcher/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p out
          cp "$APK" out/YunSeek-1.8.1-debug.apk
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign" -c -p 4 out/YunSeek-1.8.1-debug.apk
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose out/YunSeek-1.8.1-debug.apk
          (cd out && sha256sum YunSeek-1.8.1-debug.apk > SHA256.txt)
          cat out/SHA256.txt

      - name: Upload APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: YunSeek-1.8.1-Android-debug
          path: |
            out/YunSeek-1.8.1-debug.apk
            out/SHA256.txt
          if-no-files-found: error
          retention-days: 30
