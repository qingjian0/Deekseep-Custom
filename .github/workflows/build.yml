name: YunSeek 1.8.1 Android signed build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yunseek-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Android Gradle Plugin 9.3.0 / Kotlin 2.4.x lint analysis uses
      # Java 21 SequencedCollection APIs (List.removeLast). JDK 17 causes
      # NoSuchMethodError during lintVitalAnalyzeRelease.
      - name: Set up Java 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          gradle-version: "9.8.2"

      - name: Accept Android SDK licenses and install required components
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;36.0.0"
          # SDK Manager stores the stable API 37.0 platform under its versioned name,
          # while this AGP build resolves compileSdk=37 through android-37.
          if [ ! -e "$ANDROID_SDK_ROOT/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_SDK_ROOT/platforms/android-37"
          fi
          test -d "$ANDROID_SDK_ROOT/platforms/android-36"
          test -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign"
          test -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"

      - name: Prepare private release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing repository secret: ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$ANDROID_STORE_PASSWORD" || { echo "Missing repository secret: ANDROID_STORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing repository secret: ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing repository secret: ANDROID_KEY_PASSWORD"; exit 1; }
          mkdir -p module
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > module/release.keystore
          test -s module/release.keystore
          keytool -list -keystore module/release.keystore \
            -storepass "$ANDROID_STORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/module/release.keystore" >> "$GITHUB_ENV"
          echo "ANDROID_STORE_PASSWORD=$ANDROID_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "Private signing keystore and alias verified."

      - name: Build YunSeek Open release
        working-directory: compose-launcher
        run: |
          set -euo pipefail
          # gradle.properties carries a Termux-only AAPT2 override. Remove it in CI so
          # AGP 9.3.0 resolves and uses its matching AAPT2 artifact instead of an older SDK binary.
          sed -i '/^[[:space:]]*android\.aapt2FromMavenOverride[[:space:]]*=/d' gradle.properties
          gradle --no-daemon --stacktrace \
            -PprotectedBuild=false \
            -PlocalApiIncluded=false \
            -PandroidCompileSdk=37 \
            :app:assembleRelease

      - name: Verify signed APK and prepare release output
        run: |
          set -euo pipefail
          APK="compose-launcher/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          # Reject incomplete or non-APK outputs before signing verification or publication.
          unzip -t "$APK" >/dev/null
          unzip -Z1 "$APK" | grep -Fxq "AndroidManifest.xml" || {
            echo "Invalid APK: AndroidManifest.xml is missing from $APK"
            unzip -Z1 "$APK" | head -n 80
            exit 1
          }
          unzip -Z1 "$APK" | grep -E '^classes([0-9]+)?[.]dex$' >/dev/null || {
            echo "Invalid APK: classes.dex is missing from $APK"
            exit 1
          }
          mkdir -p out
          cp "$APK" out/YunSeek-1.8.1-release.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -c -p 4 out/YunSeek-1.8.1-release.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs out/YunSeek-1.8.1-release.apk
          (cd out && sha256sum YunSeek-1.8.1-release.apk > SHA256.txt)
          cat out/SHA256.txt
      - name: Publish signed APK download
        uses: softprops/action-gh-release@6cbd405e2c4e67a21c47fa9e383d020e4e28b836 # v2.3.3
        with:
          tag_name: yunseek-1.8.1-signed-build-${{ github.run_number }}
          name: YunSeek 1.8.1 signed build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: |
            out/YunSeek-1.8.1-release.apk
            out/SHA256.txt
          fail_on_unmatched_files: true

      - name: Upload signed APK and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: YunSeek-1.8.1-Android-signed-release
          path: |
            out/YunSeek-1.8.1-release.apk
            out/SHA256.txt
          if-no-files-found: error
          retention-days: 30
