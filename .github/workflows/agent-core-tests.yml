name: Agent Core contract tests and Open build

on:
  push:
    branches:
      - "work/**"
    paths:
      - "module/src/com/dsmod/probe/agentcore/**"
      - "module/tests/com/dsmod/probe/agentcore/**"
      - "scripts/test-agent-core.sh"
      - ".github/workflows/agent-core-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-core-batch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Run platform-neutral Agent Core tests
        run: bash scripts/test-agent-core.sh

  open-debug-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"
      - name: Create ephemeral debug signing key
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/agent-core-debug.keystore"
          keytool -genkeypair -v -keystore "$KEYSTORE" \
            -storepass android -alias androiddebugkey -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
      - name: Install Android SDK components
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Build Open debug APK
        working-directory: compose-launcher
        run: |
          set -euo pipefail
          sed -i '/^[[:space:]]*android\.aapt2FromMavenOverride[[:space:]]*=/d' gradle.properties
          gradle --no-daemon --stacktrace \
            -PprotectedBuild=false \
            -PlocalApiIncluded=false \
            -PandroidCompileSdk=36 \
            :app:assembleDebug
      - name: Verify APK structure
        run: |
          set -euo pipefail
          APK="compose-launcher/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -Z1 "$APK" | grep -Fxq "AndroidManifest.xml"
          unzip -Z1 "$APK" | grep -E '^classes([0-9]+)?[.]dex$' >/dev/null
