name: Agent Core contract tests

on:
  push:
    branches:
      - "work/**"
    paths:
      - "module/src/com/dsmod/probe/agentcore/**"
      - "module/tests/com/dsmod/probe/agentcore/**"
      - "scripts/test-agent-core.sh"
      - ".github/workflows/agent-core-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Run platform-neutral Agent Core tests
        run: bash scripts/test-agent-core.sh
